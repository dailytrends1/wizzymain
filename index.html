<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age verification · 18+</title>

  <style>
    /* Minimal global reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4fd 0%, #e9eefa 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    /* Main card – clean, premium, age gate */
    .age-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      box-shadow: 0 24px 48px -12px rgba(0, 20, 50, 0.25), 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid rgba(255,255,255,0.7);
      transition: transform 0.2s ease;
    }

    /* Small badge – keeps the Mozambique reference but neutral */
    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: #eef6ff;
      color: #0066ff;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
      border: 1px solid #d4e4ff;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0b1e3a;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
      line-height: 1.2;
    }

    .question {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
      margin: 0.5rem 0 0.75rem;
      background: #fff6e6;
      padding: 0.75rem 1rem;
      border-radius: 80px;
      display: inline-block;
      line-height: 1.3;
      border: 1px solid #ffe8c7;
    }

    /* small descriptive text */
    .hint {
      font-size: 0.95rem;
      color: #5a6e8a;
      line-height: 1.5;
      margin: 0.5rem 0 1.75rem;
      padding: 0 0.25rem;
    }

    /* buttons container */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0.5rem 0 1rem;
    }

    /* Primary 'yes' button */
    .btn-yes {
      display: block;
      width: 100%;
      background: #111;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 1rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      letter-spacing: 0.3px;
    }

    .btn-yes:hover {
      background: #1e2a3a;
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.18);
    }

    .btn-yes:active {
      transform: scale(0.98);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    /* 'no' button – subtle, non-prominent but clear */
    .btn-no {
      display: block;
      width: 100%;
      background: transparent;
      color: #4f5f73;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      text-align: center;
      border: 2px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #ffffffd6;
      backdrop-filter: blur(2px);
    }

    .btn-no:hover {
      background: #f1f4f9;
      border-color: #9aaabb;
      color: #1e2a3a;
    }

    .btn-no:active {
      transform: scale(0.98);
    }

    /* small note / legal */
    .note {
      margin-top: 1.5rem;
      color: #8a99ab;
      font-size: 0.7rem;
      line-height: 1.5;
      border-top: 1px solid #e2e8f0;
      padding-top: 1.2rem;
      letter-spacing: 0.2px;
    }

    /* optional icon / emoji touch */
    .lock-icon {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      opacity: 0.9;
    }

    /* transition message (hidden by default) */
    .transition-message {
      margin-top: 1rem;
      background: #e6f7e6;
      color: #0a5e2a;
      font-weight: 600;
      padding: 1rem;
      border-radius: 80px;
      font-size: 0.95rem;
      border: 1px solid #b8e0b8;
      display: none;
      text-align: center;
    }

    /* disable interaction while transitioning */
    .disabled {
      opacity: 0.7;
      pointer-events: none;
    }

    /* responsive */
    @media (max-width: 420px) {
      .age-card {
        padding: 1.8rem 1.5rem 1.5rem;
      }
      h1 {
        font-size: 1.7rem;
      }
      .question {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="age-card" id="ageCard">
    <div class="badge">🇲🇿 Moçambique · verificação</div>
    
    <!-- Main question prominently -->
    <div class="question">Are you 18 years and above?</div>
    
    <p class="hint">
      Please confirm your age to continue. This quick check helps us provide appropriate content.
    </p>

    <!-- Yes / No actions -->
    <div class="actions">
      <button class="btn-yes" id="yesBtn" aria-label="Yes, I am 18 or older">
        Yes, I am 18+
      </button>
      <button class="btn-no" id="noBtn" aria-label="No, I am under 18">
        No, I am under 18
      </button>
    </div>

    <!-- subtle note -->
    <div class="note">
      ✓ Takes less than 10 seconds &nbsp;•&nbsp; 🔒 Your privacy is respected
    </div>

    <!-- hidden transition message (shown after click) -->
    <div id="transitionMsg" class="transition-message">
      ✅ Verified! Redirecting you now…
    </div>
  </div>

  <script>
    (function() {
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const transitionMsg = document.getElementById('transitionMsg');

      // The destination offer link (with placeholders)
      const REDIRECT_URL = 'https://1buv.com/link?z=10588739&var={SOURCE_ID}&ymid={CLICK_ID}';

      // Shared redirect handler for both buttons
      function goToOffer(sourceTag) {
        // Show transition feedback
        transitionMsg.style.display = 'block';
        transitionMsg.textContent = '✅ Redirecting you now…';

        // Disable both buttons to prevent double clicks
        yesBtn.classList.add('disabled');
        noBtn.classList.add('disabled');
        yesBtn.disabled = true;
        noBtn.disabled = true;

        // Optional: change label based on the button clicked
        if (sourceTag === 'yes') {
          yesBtn.textContent = '✓ Verified';
        } else {
          noBtn.textContent = '✓ Continuing';
        }

        // Build final URL with dynamic placeholders
        let finalUrl = REDIRECT_URL
          .replace('{SOURCE_ID}', sourceTag === 'yes' ? 'age_18_plus' : 'age_under_18')
          .replace('{CLICK_ID}', 'click_' + Date.now());

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = finalUrl;
        }, 600);
      }

      // Attach event listeners — both buttons go to the offer link
      yesBtn.addEventListener('click', () => goToOffer('yes'));
      noBtn.addEventListener('click', () => goToOffer('no'));
    })();
  </script>
</body>
</html>
